[package]
name = "pixiv-manager"
version.workspace = true
edition.workspace = true

[lib]
name = "pixiv_manager"
path = "src/lib.rs"

[features]
# Shared test fixtures for the bench and proptest suites.
test-util = []
# Profiling telemetry: global tracer, tagged allocator, pprof sampling and
# the `profiler` example. Compiled out entirely when not enabled.
profiling = ["dep:pprof", "pixivj-rs/profiling"]

[[bin]]
name = "pixiv-manager"
path = "src/main.rs"

[[bin]]
name = "pixiv-manager-cli"
path = "src/cli/main.rs"

[[example]]
name = "profiler"
path = "examples/profiler.rs"
required-features = ["profiling"]

[dependencies]
pixivj-rs = { path = "../pixivj-rs" }
iced = { workspace = true }
rfd = "0.17"
fast_image_resize = "6"
open = "5"
tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
lru = "0.19"
sha2 = "0.11"
base64 = "0.23"
md-5 = "0.11"
rand = "0.10"
dirs = "7"
# Cross-platform process/system memory figures for the F3 debug overlay
# (`platform::memory_stats`). Only the `system` feature is needed — no disks,
# networks, GPUs or users.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
toml = "1"
log = "0.4"
env_logger = "0.11"
# Profiling only (feature = "profiling"): CPU sampling + flamegraph output.
# Only Unix has `pprof`; the profiling feature stays usable on every platform
# (see `src/profiling/cpu.rs`), but CPU sampling itself is Unix-only.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

# Atomic file replacement (platform::fs) needs the Win32 rename semantics:
# `ReplaceFileW` / `MoveFileExW`, which have no portable equivalent.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
# Windows executable resources (icon, VERSIONINFO, manifest) — see build.rs.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
iced_test = "0.14"
# Enable the shared test fixtures for the integration test suites.
pixiv-manager = { path = ".", features = ["test-util"] }

[[bench]]
name = "filter_sort"
harness = false
required-features = ["test-util"]
