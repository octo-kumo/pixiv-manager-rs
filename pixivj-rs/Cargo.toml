[package]
name = "pixivj-rs"
version = "0.1.0"
edition = "2021"

[features]
# Lightweight global profiling tracer (HTTP/IO samples). Off by default:
# compiled out entirely for zero overhead.
profiling = []

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
md-5 = "0.11"
async-trait = "0.1"
log = "0.4"
