[workspace]
resolver = "2"
members = ["pixivj-rs", "pixiv-manager"]

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "socks", "rustls", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
iced = { version = "0.14", features = ["image", "canvas", "tokio", "advanced"] }
proptest = "1"
criterion = "0.8"

# ── Release: minimal binary size ──────────────────────────────────────
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ── Dev: Cranelift codegen, no debug, no opt, max parallelism ──────────
# Cranelift ignores debug/codegen-units, but inlining=true helps a bit.
# Deps compiled with opt-level=2 once and cached; our code is fast-iterated.
[profile.dev]
opt-level = 0
debug = 0
incremental = true

# ── Test: same as dev ─────────────────────────────────────────────────
[profile.test]
opt-level = 0
debug = 0
incremental = true

# ── Profiling: optimized + full debug symbols for line-level attribution.
#    Used by the profiler harness and `--features profiling` GUI runs:
#      cargo build --profile profiling --features profiling
#    Full symbols are required for perf/pprof flamegraph source lines.
[profile.profiling]
inherits = "release"
opt-level = 3
debug = true
strip = "none"
panic = "unwind"
lto = "thin"
codegen-units = 16

# ── Dep optimization: deps cached at opt-level 2 ─────────────────────
[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.test.package."*"]
opt-level = 2
debug = 0
